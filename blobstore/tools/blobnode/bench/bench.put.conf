{
    "log_level":1,
    "cluster_id": 10000,

    "mode": 6,             # [0:invalid,put,get,delete,alloc,release,6:putUntilFull,getFull,delFull]
    "bid_start": 1,
    "max_cnt": 131072,     # max bid count per concurrence, 16GB/128KB = 131072
    "per_disk": 8,         # 8 chunk per disk
    "per_vuid": 1,         # 1 gorountine per chunk
    "random": true,        # random write from src data, Prevents write data will cached into linux system memory
    "data_size": "131072", # [4B, 4K, 32K, 64K, 128K, 1M, 4M, 8M, 16M], random read bid

    "disk_id": 9,          # match /home/var/data1/.sys/.format.json
    "max_round": 10,
    "print_sec": 60,

    # In write mode, if the vuid is empty, alloc new vuids before writing. Otherwise, do work according to the configured vuid
    "vuids":{
        # "9": [17592169267203,17592169267204],
    },

    "cluster_mgr": {
        "hosts": [
            "http://XXXX:YYYY"
        ],
        "transport_config": {
        "max_conns_per_host": 4,
            "auth": {
                "enable_auth": false,
                "secret": "XXXX"
            }
        }
    }
}
